name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: python -m pip install --upgrade pip networkx numpy pytest

      - name: Test computational-effort reporter
        run: python -m pytest code/tests/test_report_computational_effort.py

      - name: Re-render computational-effort snapshot
        run: |
          python code/scripts/report_computational_effort.py render \
            --snapshot reports/order23_computational_effort_20260722.json \
            --output-prefix /tmp/order23_computational_effort_20260722
          cmp reports/order23_computational_effort_20260722.json /tmp/order23_computational_effort_20260722.json
          cmp reports/order23_computational_effort_20260722.tsv /tmp/order23_computational_effort_20260722.tsv
          cmp docs/computational-effort.md /tmp/order23_computational_effort_20260722.md

      - name: Check README census hashes
        run: python code/scripts/check_hashes.py --readme README.md --results-dir results

      - name: Reproduce census categorization (characterization clauses)
        run: python code/scripts/classify_census_characterization.py --orders 13 15 17

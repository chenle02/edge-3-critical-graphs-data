name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: python -m pip install --upgrade pip networkx numpy pytest

      - name: Test computational-effort reporter
        run: python -m pytest code/tests/test_report_computational_effort.py

      - name: Verify finite boundary-state certificates
        run: |
          python -m pytest \
            code/tests/test_analyze_pattern_i_boundary_states.py \
            code/tests/test_analyze_pattern_ii_boundary_states.py

      - name: Verify checkpoint integrity and Order-19 replay receipt
        run: |
          PYTHONPATH=code python -m pytest \
            code/tests/test_phase2_pipeline.py \
            code/tests/test_order19_replay_receipt.py

      - name: Re-render computational-effort snapshots
        run: |
          for prefix in \
              order21_computational_effort_20260722 \
              order22_computational_effort_20260722 \
              order23_computational_effort_20260723; do
            python code/scripts/report_computational_effort.py render \
              --snapshot "reports/${prefix}.json" \
              --output-prefix "/tmp/${prefix}"
            cmp "reports/${prefix}.json" "/tmp/${prefix}.json"
            cmp "reports/${prefix}.tsv" "/tmp/${prefix}.tsv"
            cmp "reports/${prefix}.md" "/tmp/${prefix}.md"
          done

      - name: Check README census hashes
        run: python code/scripts/check_hashes.py --readme README.md --results-dir results

      - name: Reproduce census categorization (characterization clauses)
        run: python code/scripts/classify_census_characterization.py --orders 13 15 17
